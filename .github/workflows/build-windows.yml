name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Podepsání se zapne samo, když je v nastavení repozitáře (Settings → Secrets) certifikát. Postup je v docs/PODEPISOVANI.md.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Testy
        run: dotnet test windows/BudisCommander.Tests/BudisCommander.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Sestavení x64
        run: dotnet publish windows/BudisCommander.Win/BudisCommander.Win.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:SourceRevisionId=${{ github.sha }} -o out/win-x64

      - name: Sestavení ARM64
        run: dotnet publish windows/BudisCommander.Win/BudisCommander.Win.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:SourceRevisionId=${{ github.sha }} -o out/win-arm64

      - name: Podepsání programů (jen když je nastavený certifikát)
        if: ${{ env.WINDOWS_CERTIFICATE != '' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe nebyl nalezen" }
          foreach ($exe in "out/win-x64/BudisCommander.exe", "out/win-arm64/BudisCommander.exe") {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Budis Commander" $exe
            if ($LASTEXITCODE -ne 0) { throw "Podepsání $exe selhalo" }
            & $signtool.FullName verify /pa $exe
            if ($LASTEXITCODE -ne 0) { throw "Ověření podpisu $exe selhalo" }
          }
          Remove-Item $pfx

      - name: Zabalení
        shell: pwsh
        run: |
          Compress-Archive -Path out/win-x64/BudisCommander.exe -DestinationPath BudisCommander-win-x64.zip
          Compress-Archive -Path out/win-arm64/BudisCommander.exe -DestinationPath BudisCommander-win-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BudisCommander-Windows
          path: |
            BudisCommander-win-x64.zip
            BudisCommander-win-arm64.zip

      - name: Smazat staré vydání, aby nové mělo správné datum (jen z větve main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete windows-latest --cleanup-tag --yes || true

      - name: Vydání ke stažení (jen z větve main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Budis Commander pro Windows (poslední sestavení)
          body: |
            Samostatná aplikace, .NET není potřeba instalovat.
            - **BudisCommander-win-arm64.zip**: Windows na ARM (např. Parallels Desktop na Macu s Apple Silicon)
            - **BudisCommander-win-x64.zip**: běžné počítače s Windows
            Rozbalte ZIP a spusťte BudisCommander.exe.

            Sestavení z commitu: `${{ github.sha }}`
          files: |
            BudisCommander-win-x64.zip
            BudisCommander-win-arm64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
