name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build BudisCommander.app
        run: ./scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BudisCommander-macOS
          path: build/BudisCommander.zip
